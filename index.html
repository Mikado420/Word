<title>赤シート単語帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 机の上に開いた単語帳1ページ。インプット=紙面、アウトプット=1枚カード。 */
:root{
  --desk:#E4E8E2; --paper:#FCFCF8; --ink:#1E2633; --muted:#67717B; --rule:#DADFD6;
  --red:#D3263A; --sheet:rgba(211,38,58,.16); --accent:#1F6F5C; --accent-ink:#FFFFFF;
  --soft:#EEF2EC; --again:#C2413A; --hard:#B7791F; --good:#1F6F5C; --easy:#2B6CB0;
  --s-yellow:#F6E27A; --s-pink:#F6A9BB; --s-green:#A3DBB4; --s-blue:#A6CDF0; --sticky-ink:#1E2633;
  --shadow:0 1px 2px rgba(30,38,51,.06),0 8px 24px rgba(30,38,51,.08);
  --f-en:"Libre Caslon Text",Georgia,"Times New Roman",serif;
  --f-disp:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#10141A; --paper:#1A2029; --ink:#E6E9EC; --muted:#99A3AE; --rule:#2C3441;
  --red:#FF6F7D; --sheet:rgba(255,111,125,.2); --accent:#4FBF9F; --accent-ink:#0E1A16;
  --soft:#222A35; --again:#F07167; --hard:#E0A84A; --good:#4FBF9F; --easy:#6EA8E6;
  --s-yellow:#E3CF66; --s-pink:#E595A8; --s-green:#8CC9A0; --s-blue:#8DB8DE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#10141A; --paper:#1A2029; --ink:#E6E9EC; --muted:#99A3AE; --rule:#2C3441;
  --red:#FF6F7D; --sheet:rgba(255,111,125,.2); --accent:#4FBF9F; --accent-ink:#0E1A16;
  --soft:#222A35; --again:#F07167; --hard:#E0A84A; --good:#4FBF9F; --easy:#6EA8E6;
  --s-yellow:#E3CF66; --s-pink:#E595A8; --s-green:#8CC9A0; --s-blue:#8DB8DE;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--desk);padding-block:8px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{font-family:var(--f-disp);font-weight:800;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:18px;background:var(--red);border-radius:2px;opacity:.85;display:inline-block}
.modes{display:flex;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:3px}
.modes button{border:0;background:none;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* toolbar */
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--red);color:var(--red);background:var(--sheet)}
.pager{margin-left:auto;display:flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.pager button{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font-size:16px;line-height:1}
.pager button:disabled{opacity:.35;cursor:default}

/* page */
.page{position:relative;background:var(--paper);border-radius:4px 10px 10px 4px;box-shadow:var(--shadow);padding:18px 18px 10px 22px;overflow:visible}
.page::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;border-radius:4px 0 0 4px;background:linear-gradient(90deg,rgba(0,0,0,.08),transparent)}
.pghead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.pghead h2{font-family:var(--f-disp);font-size:17px;margin:0;font-weight:800}
.pghead span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.entry{position:relative;display:grid;grid-template-columns:44px 1fr 32px;gap:4px 8px;padding:12px 0;border-bottom:1px dashed var(--rule);transition:background .4s}
.entry:last-child{border-bottom:0}
.entry.flash{background:var(--soft)}
.num{font-family:var(--f-en);font-size:12px;color:var(--muted);padding-top:6px;font-variant-numeric:tabular-nums}
.ebody{min-width:0;display:flex;flex-direction:column;gap:3px}
.head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.word{font-family:var(--f-en);font-weight:700;font-size:21px;letter-spacing:.005em}
.pos{font-size:11px;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 4px;line-height:1.5}
.lv{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.lv::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rule)}
.lv.l1::before{background:var(--hard)} .lv.l2::before{background:var(--good)}
.mean{color:var(--red);font-weight:700;font-size:15px;border-radius:3px;transition:color .15s,background .15s;align-self:flex-start;padding:0 2px;margin-left:-2px}
.sheet-on .mean:not(.peek){color:transparent;background:var(--sheet)}
.sheet-on .mean{cursor:pointer}
.ex{font-size:13.5px;line-height:1.55}
.ex .en{font-family:var(--f-en);display:block}
.ex .en b{text-decoration:underline;text-decoration-color:var(--red);text-underline-offset:3px}
.ex .ja{color:var(--muted);display:block;font-size:12.5px}
.rel{font-size:12px;color:var(--muted)}
.tagbtn{width:32px;height:32px;border-radius:8px;border:1px dashed var(--rule);background:none;display:grid;place-items:center;align-self:start;margin-top:2px;color:var(--muted)}
.tagbtn svg{width:16px;height:16px}
.sticky{position:absolute;right:-14px;top:10px;width:30px;min-height:46px;border-radius:2px 4px 4px 2px;box-shadow:1px 2px 4px rgba(0,0,0,.18);border:0;padding:0;display:grid;place-items:center;font-size:10px;color:var(--sticky-ink);writing-mode:vertical-rl;font-weight:700;letter-spacing:.1em}
.c-yellow{background:var(--s-yellow)} .c-pink{background:var(--s-pink)} .c-green{background:var(--s-green)} .c-blue{background:var(--s-blue)}
.memo{grid-column:2/3;font-size:12.5px;color:var(--sticky-ink);padding:4px 8px;border-radius:2px;align-self:start;justify-self:start;max-width:100%;overflow-wrap:anywhere}
.pgfoot{text-align:center;font-family:var(--f-en);font-size:12px;color:var(--muted);padding-top:8px;font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs:empty{display:none}
.tab{flex:none;border:0;border-radius:3px;padding:4px 10px;font-size:12px;color:var(--sticky-ink);font-family:var(--f-en);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.hint{font-size:12px;color:var(--muted);margin:0}

/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.35);z-index:20}
.sheetpanel{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheetin{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheetin h3{margin:0;font-family:var(--f-en);font-size:20px}
.swatches{display:flex;gap:10px}
.sw{width:44px;height:44px;border-radius:4px;border:2px solid transparent;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.swl{font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
textarea{width:100%;box-sizing:border-box;border:1px solid var(--rule);border-radius:8px;background:var(--desk);color:var(--ink);font:inherit;padding:10px;min-height:64px;resize:vertical}
.row{display:flex;gap:8px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;flex:1}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft)}
.btn.warn{background:none;color:var(--again);border:1px solid var(--rule);flex:none}

/* output dashboard */
.panel{background:var(--paper);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-en);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.due b{color:var(--red)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:8px 4px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:84px}
.fcb{display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}
.fcb i{width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.fcb i.z{background:var(--rule)}
.fcb span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fcb em{font-style:normal;font-size:11px;font-variant-numeric:tabular-nums}
.retbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.retbar i{display:block;height:100%;background:var(--accent)}
.start{font-size:17px;padding:16px}
.start:disabled{opacity:.45;cursor:default}

/* review */
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog .track{flex:1;height:4px;background:var(--paper);border-radius:2px;overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prog button{border:0;background:none;color:var(--muted);font-size:13px;padding:4px}
.card{position:relative;background:var(--paper);border-radius:12px;box-shadow:var(--shadow);min-height:340px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;user-select:none;overflow:hidden}
.card .tagline{position:absolute;top:12px;left:16px;font-size:11px;color:var(--muted);letter-spacing:.06em}
.card .badge{position:absolute;top:0;right:18px;width:18px;height:34px;border-radius:0 0 2px 2px}
.card .w{font-family:var(--f-en);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.1;overflow-wrap:anywhere}
.card .tap{font-size:12px;color:var(--muted)}
.ans{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%;animation:up .18s ease-out}
.ans .m{color:var(--red);font-weight:700;font-size:20px}
.ans .ex{text-align:left;width:100%;max-width:420px;background:var(--soft);border-radius:8px;padding:10px 12px}
.ans .memo{grid-column:auto;font-size:13px}
@keyframes up{from{opacity:.3;transform:translateY(6px)}to{opacity:1;transform:none}}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{border:0;border-radius:10px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:0;color:#fff;font-weight:700;font-size:14px}
.g small{font-weight:500;font-size:11px;opacity:.9;font-variant-numeric:tabular-nums}
.g1{background:var(--again)} .g2{background:var(--hard)} .g3{background:var(--good)} .g4{background:var(--easy)}
:root[data-theme="dark"] .g{color:#10141A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .g{color:#10141A}}
.reveal{font-size:16px;padding:14px}
.kbd{font-size:11px;color:var(--muted);text-align:center}
.done{text-align:center;align-items:center}
.done h2{font-family:var(--f-disp);margin:0;font-size:22px}
.done p{margin:0;color:var(--muted)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){.entry{grid-template-columns:36px 1fr 30px}.page{padding:16px 14px 8px 16px}.stat b{font-size:26px}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><i></i>赤シート単語帳</div>
    <div class="modes" role="group" aria-label="モード">
      <button id="m-in" aria-pressed="true">インプット</button>
      <button id="m-out" aria-pressed="false">アウトプット</button>
    </div>
  </header>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
/* ---------- data ---------- */
const RAW=[
["abandon","動","〜を捨てる、断念する","They had to abandon the plan because of the storm.","嵐のため計画を断念しなければならなかった。","≒ give up"],
["acquire","動","〜を獲得する、習得する","Children acquire language surprisingly quickly.","子どもは驚くほど早く言語を習得する。","名 acquisition"],
["adequate","形","十分な、適切な","The room has adequate light for reading.","その部屋には読書に十分な明かりがある。","≒ sufficient"],
["anticipate","動","〜を予期する","We anticipate a large crowd at the festival.","祭りには大勢の人出が予想される。","名 anticipation"],
["apparent","形","明らかな、見かけの","It soon became apparent that he was lying.","彼が嘘をついているのはすぐに明らかになった。","副 apparently 見たところ"],
["approach","名・動","取り組み方；〜に近づく","We need a new approach to the problem.","その問題には新しい取り組み方が必要だ。","approach to 〜 の to に注意"],
["assume","動","〜と思い込む、仮定する","Don't assume that everyone agrees with you.","皆が賛成していると思い込んではいけない。","名 assumption"],
["attribute","動","AをBのせいにする(A to B)","She attributes her success to hard work.","彼女は成功を努力のおかげだと考えている。","アクセント：動 at-TRIB-ute"],
["cease","動","終わる、〜をやめる","The factory ceased production last year.","その工場は昨年生産を停止した。","≒ stop"],
["coherent","形","首尾一貫した","Your essay needs a more coherent argument.","君の小論文にはもっと一貫した論証が必要だ。",""],
["comprehend","動","〜を理解する","He could not comprehend the size of the universe.","彼は宇宙の大きさを理解できなかった。","形 comprehensive 包括的な"],
["conceive","動","〜を思いつく、想像する","It is hard to conceive of life without phones.","電話のない生活は想像しにくい。","名 concept"],
["consequence","名","結果、重要性","Every choice has consequences.","あらゆる選択には結果が伴う。","副 consequently その結果"],
["considerable","形","かなりの","The project took a considerable amount of time.","その計画にはかなりの時間がかかった。","× considerate 思いやりのある"],
["contradict","動","〜と矛盾する、〜に反論する","The evidence contradicts his story.","証拠は彼の話と矛盾している。","名 contradiction"],
["convey","動","〜を伝える、運ぶ","Words cannot convey how grateful I am.","どれほど感謝しているか言葉では伝えられない。",""],
["crucial","形","決定的に重要な","Sleep is crucial for memory.","睡眠は記憶にとって極めて重要だ。","≒ vital"],
["decline","動・名","減少する；〜を断る；減少","The birth rate continues to decline.","出生率は低下し続けている。",""],
["deliberate","形","意図的な、慎重な","It was a deliberate attempt to mislead us.","それは私たちを欺こうとする意図的な試みだった。","副 deliberately わざと"],
["derive","動","〜を引き出す、由来する(from)","Many English words derive from Latin.","多くの英単語はラテン語に由来する。",""],
["distinguish","動","〜を区別する","Can you distinguish a crow from a raven?","カラスとワタリガラスを区別できますか。","distinguish A from B"],
["elaborate","形・動","精巧な；詳しく述べる","Could you elaborate on that point?","その点について詳しく説明してもらえますか。",""],
["eliminate","動","〜を取り除く","We must eliminate unnecessary costs.","不要な費用を削減しなければならない。",""],
["emerge","動","現れる、明らかになる","New problems emerged during the test.","試験中に新たな問題が現れた。","名 emergence"],
["enhance","動","〜を高める","Music can enhance concentration.","音楽は集中力を高めることがある。",""],
["evaluate","動","〜を評価する","Teachers evaluate students in many ways.","教師は様々な方法で生徒を評価する。","名 evaluation"],
["evident","形","明白な","Her talent was evident from an early age.","彼女の才能は幼い頃から明白だった。","≒ obvious"],
["exaggerate","動","(〜を)誇張する","He tends to exaggerate his achievements.","彼は自分の業績を誇張しがちだ。","綴り：g が2つ"],
["feasible","形","実行可能な","Is it feasible to finish by Friday?","金曜までに終えるのは実行可能だろうか。",""],
["fundamental","形","根本的な、基本的な","Freedom of speech is a fundamental right.","言論の自由は基本的な権利だ。",""],
["hypothesis","名","仮説","The data supported our hypothesis.","データは我々の仮説を支持した。","複 hypotheses"],
["imply","動","〜を暗に意味する","His silence implied agreement.","彼の沈黙は同意を意味していた。","名 implication"],
["indispensable","形","不可欠な","A dictionary is indispensable for learners.","学習者にとって辞書は不可欠だ。","≒ essential"],
["inevitable","形","避けられない","Change is inevitable.","変化は避けられない。",""],
["inherent","形","本来備わっている(in)","There are risks inherent in any investment.","どんな投資にも本質的なリスクがある。",""],
["interpret","動","〜を解釈する、通訳する","People interpret the poem in different ways.","人々はその詩を様々に解釈する。",""],
["maintain","動","〜を維持する、主張する","He maintains that he is innocent.","彼は無実だと主張している。","名 maintenance"],
["neglect","動","〜を怠る、無視する","Don't neglect your health.","健康をおろそかにしてはいけない。",""],
["obtain","動","〜を得る","You must obtain permission first.","まず許可を得なければならない。","≒ get"],
["perceive","動","〜に気づく、〜とみなす","Dogs perceive sounds we cannot hear.","犬は人間に聞こえない音を感じ取る。","名 perception"],
["phenomenon","名","現象","Rainbows are a natural phenomenon.","虹は自然現象だ。","複 phenomena"],
["precise","形","正確な","Give me the precise time of arrival.","正確な到着時刻を教えてください。",""],
["prevail","動","広まっている、勝る","This custom still prevails in rural areas.","この習慣は農村部で今も広く見られる。","形 prevalent"],
["pursue","動","〜を追求する","She decided to pursue a career in medicine.","彼女は医療の道を進むことに決めた。","名 pursuit"],
["reluctant","形","気が進まない","He was reluctant to admit his mistake.","彼は自分の誤りを認めたがらなかった。","be reluctant to do"],
["substantial","形","かなりの、実質的な","There was a substantial increase in sales.","売上がかなり増加した。",""],
["sufficient","形","十分な","We have sufficient evidence.","我々には十分な証拠がある。","⇔ insufficient"],
["vague","形","漠然とした","He gave only a vague answer.","彼はあいまいな答えしかしなかった。","≒ ambiguous"]
];
const WORDS=RAW.map((r,i)=>({id:i+1,w:r[0],pos:r[1],m:r[2],en:r[3],ja:r[4],rel:r[5]}));
const PER=6, PAGES=Math.ceil(WORDS.length/PER);
const COLORS={yellow:"苦手",pink:"要注意",green:"例文",blue:"派生"};

/* ---------- storage ---------- */
const KEY="akasheet-v1";
let S={cards:{},notes:{},read:{},page:0,sheet:false,mode:"in",filter:"all"};
try{const v=JSON.parse(localStorage.getItem(KEY)||"null"); if(v) S=Object.assign(S,v);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- FSRS (v4 default weights) ---------- */
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DAY=864e5, clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
const retr=(t,s)=>Math.pow(1+t/(9*s),-1);
const D0=g=>clamp(W[4]-(g-3)*W[5],1,10);
function next(c,g,now){
  let s,d,lapses=c?c.lapses||0:0;
  if(!c||!c.reps){s=W[g-1];d=D0(g);}
  else{
    const r=retr(Math.max(0,(now-c.last)/DAY),c.s);
    const dp=c.d-W[6]*(g-3); d=clamp(W[7]*D0(3)+(1-W[7])*dp,1,10);
    if(g===1){s=Math.min(c.s,W[11]*Math.pow(c.d,-W[12])*(Math.pow(c.s+1,W[13])-1)*Math.exp((1-r)*W[14]));lapses++;}
    else s=c.s*(1+Math.exp(W[8])*(11-c.d)*Math.pow(c.s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
  }
  const ivl=g===1?DAY/144:Math.max(1,Math.round(s))*DAY;
  return {s,d,ivl,due:now+ivl,last:now,reps:(c?c.reps||0:0)+1,lapses};
}
function previews(c,now){
  const p=[1,2,3,4].map(g=>next(c,g,now));
  for(let i=2;i<4;i++) if(p[i].ivl<=p[i-1].ivl){p[i].ivl=p[i-1].ivl+DAY;p[i].due=now+p[i].ivl;}
  return p;
}
function fmt(ms){const d=ms/DAY; if(d<1) return Math.round(ms/6e4)+"分"; if(d<31) return Math.round(d)+"日"; if(d<365) return Math.round(d/30)+"ヶ月"; return (d/365).toFixed(1)+"年";}
function level(id){const c=S.cards[id]; if(!c||!c.reps) return 0; return c.s>=21?2:1;}

/* ---------- utils ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(4,"0");
const hl=(en,w)=>esc(en).replace(new RegExp("\\b("+w.slice(0,Math.max(4,w.length-2))+"\\w*)","i"),"<b>$1</b>");
const tagIcon='<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 2h8v12l-4-3-4 3z"/></svg>';

/* ---------- mode ---------- */
function setMode(m){S.mode=m;save();$("#m-in").setAttribute("aria-pressed",m==="in");$("#m-out").setAttribute("aria-pressed",m==="out");sess=null;render();}
$("#m-in").onclick=()=>setMode("in"); $("#m-out").onclick=()=>setMode("out");
function render(){S.mode==="in"?renderBook():(sess?renderCard():renderDash());window.scrollTo({top:0});}

/* ---------- INPUT: book ---------- */
function renderBook(){
  const p=S.page, list=WORDS.slice(p*PER,p*PER+PER);
  list.forEach(w=>S.read[w.id]=1); save();
  const tabs=Object.keys(S.notes).map(Number).sort((a,b)=>a-b).map(id=>{const n=S.notes[id],w=WORDS[id-1];return `<button class="tab c-${n.color}" data-jump="${id}">${esc(w.w)}</button>`}).join("");
  $("#view").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="bar">
      <button class="chip" id="sheetbtn" aria-pressed="${S.sheet}">赤シート ${S.sheet?"ON":"OFF"}</button>
      <div class="pager"><button id="prev" aria-label="前のページ" ${p===0?"disabled":""}>‹</button>p.${p+1} / ${PAGES}<button id="next" aria-label="次のページ" ${p===PAGES-1?"disabled":""}>›</button></div>
    </div>
    <div class="tabs" aria-label="付箋一覧">${tabs}</div>
    <section class="page ${S.sheet?"sheet-on":""}" id="page">
      <div class="pghead"><h2>Section ${Math.floor(p/2)+1}</h2><span>No.${pad(p*PER+1)}–${pad(p*PER+list.length)}</span></div>
      ${list.map(w=>{const n=S.notes[w.id],lv=level(w.id);return `
      <article class="entry" id="e${w.id}">
        <div class="num">${pad(w.id)}</div>
        <div class="ebody">
          <div class="head"><span class="word">${esc(w.w)}</span><span class="pos">${w.pos}</span><span class="lv l${lv}">${["未学習","学習中","定着"][lv]}</span></div>
          <div class="mean" data-mean>${esc(w.m)}</div>
          <div class="ex"><span class="en">${hl(w.en,w.w)}</span><span class="ja">${esc(w.ja)}</span></div>
          ${w.rel?`<div class="rel">${esc(w.rel)}</div>`:""}
        </div>
        <button class="tagbtn" data-tag="${w.id}" aria-label="${esc(w.w)} に付箋">${tagIcon}</button>
        ${n?`<button class="sticky c-${n.color}" data-tag="${w.id}" aria-label="付箋を編集">${COLORS[n.color]}</button>`:""}
        ${n&&n.memo?`<div class="memo c-${n.color}">${esc(n.memo)}</div>`:""}
      </article>`}).join("")}
      <div class="pgfoot">— ${p+1} —</div>
    </section>
    <p class="hint">赤シートONで意味を隠し、タップでめくれます。左右スワイプでページ移動。読んだページの単語がアウトプットに出題されます。</p>
  </div>`;
  $("#sheetbtn").onclick=()=>{S.sheet=!S.sheet;save();renderBook();};
  $("#prev").onclick=()=>go(-1); $("#next").onclick=()=>go(1);
  document.querySelectorAll("[data-mean]").forEach(el=>el.onclick=()=>{if(S.sheet)el.classList.toggle("peek");});
  document.querySelectorAll("[data-tag]").forEach(el=>el.onclick=()=>openNote(+el.dataset.tag));
  document.querySelectorAll("[data-jump]").forEach(el=>el.onclick=()=>{const id=+el.dataset.jump;S.page=Math.floor((id-1)/PER);renderBook();const e=$("#e"+id);if(e){e.scrollIntoView({block:"center",behavior:"smooth"});e.classList.add("flash");setTimeout(()=>e.classList.remove("flash"),900);}});
  const pg=$("#page");let x0=null,y0=0;
  pg.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  pg.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1);x0=null;},{passive:true});
}
function go(d){const n=S.page+d;if(n<0||n>=PAGES)return;S.page=n;save();renderBook();window.scrollTo({top:0});}

function openNote(id){
  const w=WORDS[id-1],n=S.notes[id]||{color:"yellow",memo:""};let color=n.color;
  $("#layer").innerHTML=`<div class="scrim" id="scrim"></div>
  <div class="sheetpanel" role="dialog" aria-label="付箋"><div class="sheetin">
    <h3>${esc(w.w)} <span style="font-family:var(--f-body);font-size:13px;color:var(--muted)">に付箋を貼る</span></h3>
    <div class="swatches">${Object.entries(COLORS).map(([k,v])=>`<div><button class="sw c-${k}" data-c="${k}" aria-pressed="${k===color}" aria-label="${v}"></button><div class="swl">${v}</div></div>`).join("")}</div>
    <textarea id="memo" placeholder="メモ（例：considerate と混同）">${esc(n.memo||"")}</textarea>
    <div class="row">${S.notes[id]?`<button class="btn warn" id="peel">はがす</button>`:""}<button class="btn ghost" id="cancel">閉じる</button><button class="btn pri" id="stick">貼る</button></div>
  </div></div>`;
  const close=()=>$("#layer").innerHTML="";
  $("#scrim").onclick=close;$("#cancel").onclick=close;
  document.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{color=b.dataset.c;document.querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#stick").onclick=()=>{S.notes[id]={color,memo:$("#memo").value.trim()};save();close();render();};
  const pe=$("#peel");if(pe)pe.onclick=()=>{delete S.notes[id];save();close();render();};
}

/* ---------- OUTPUT: dashboard ---------- */
const NEW_LIMIT=10;
function pool(){
  return WORDS.filter(w=>S.filter==="notes"?S.notes[w.id]:S.filter==="read"?S.read[w.id]:true);
}
function counts(now){
  const pl=pool();
  const due=pl.filter(w=>{const c=S.cards[w.id];return c&&c.reps&&c.due<=now});
  const fresh=pl.filter(w=>!(S.cards[w.id]&&S.cards[w.id].reps));
  fresh.sort((a,b)=>(S.read[b.id]?1:0)-(S.read[a.id]?1:0)||a.id-b.id);
  return {due,fresh:fresh.slice(0,NEW_LIMIT),freshAll:fresh.length};
}
function renderDash(){
  const now=Date.now(),{due,fresh}=counts(now);
  const learned=WORDS.filter(w=>S.cards[w.id]&&S.cards[w.id].reps);
  const mature=learned.filter(w=>S.cards[w.id].s>=21).length;
  const avgR=learned.length?learned.reduce((a,w)=>{const c=S.cards[w.id];return a+retr(Math.max(0,(now-c.last)/DAY),c.s)},0)/learned.length:0;
  const today=new Date();today.setHours(0,0,0,0);
  const fc=[...Array(7)].map((_,i)=>{const a=today.getTime()+i*DAY,b=a+DAY;return learned.filter(w=>{const d=S.cards[w.id].due;return i===0?d<b:d>=a&&d<b}).length});
  const mx=Math.max(1,...fc),wd="日月火水木金土";
  $("#view").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:12px">
  <section class="panel">
    <div class="stats">
      <div class="stat due"><b>${due.length}</b><span>今日の復習</span></div>
      <div class="stat"><b>${fresh.length}</b><span>新しい単語</span></div>
      <div class="stat"><b>${mature}<small style="font-size:14px;color:var(--muted)">/${WORDS.length}</small></b><span>定着した単語</span></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between"><span class="lbl">いまの記憶保持率（推定）</span><span style="font-size:13px;font-variant-numeric:tabular-nums">${learned.length?Math.round(avgR*100)+"%":"—"}</span></div>
      <div class="retbar"><i style="width:${Math.round(avgR*100)}%"></i></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <span class="lbl">出題範囲</span>
      <div class="seg" role="group">
        ${[["read","読んだ単語"],["notes","付箋だけ"],["all","すべて"]].map(([k,v])=>`<button data-f="${k}" aria-pressed="${S.filter===k}">${v}</button>`).join("")}
      </div>
    </div>
    <button class="btn pri start" id="go" ${due.length+fresh.length?"":"disabled"}>${due.length+fresh.length?`復習をはじめる（${due.length+fresh.length}枚）`:"今日の分は完了"}</button>
  </section>
  <section class="panel">
    <span class="lbl">これから7日間の復習予定</span>
    <div class="fc">${fc.map((n,i)=>`<div class="fcb"><em>${n||""}</em><i class="${n?"":"z"}" style="height:${Math.round(n/mx*56)}px"></i><span>${i===0?"今日":wd[(today.getDay()+i)%7]}</span></div>`).join("")}</div>
    <p class="hint">忘れかける直前（想起率90%の地点）に出題されるよう、1枚ずつ次回の日付を計算しています。</p>
  </section>
  <button class="btn warn" id="reset" style="align-self:center">学習記録をリセット</button>
  </div>`;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{S.filter=b.dataset.f;save();renderDash();});
  $("#go").onclick=startSession;
  $("#reset").onclick=e=>{const b=e.currentTarget;if(b.dataset.c){S.cards={};save();renderDash();}else{b.dataset.c=1;b.textContent="もう一度押すとリセットします";}};
}

/* ---------- OUTPUT: session ---------- */
let sess=null;
function startSession(){
  const now=Date.now(),{due,fresh}=counts(now);
  due.sort((a,b)=>{const ca=S.cards[a.id],cb=S.cards[b.id];return retr((now-ca.last)/DAY,ca.s)-retr((now-cb.last)/DAY,cb.s)});
  const q=[];let i=0,j=0;
  while(i<due.length||j<fresh.length){ if(i<due.length)q.push(due[i++].id); if(i<due.length)q.push(due[i++].id); if(j<fresh.length)q.push(fresh[j++].id); }
  sess={q,total:q.length,done:0,shown:false,tally:[0,0,0,0],t0:Date.now()};
  renderCard();
}
function renderCard(){
  if(!sess.q.length) return renderDone();
  const id=sess.q[0],w=WORDS[id-1],c=S.cards[id],n=S.notes[id],now=Date.now();
  const pv=previews(c,now);
  const isNew=!(c&&c.reps);
  $("#view").innerHTML=`
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="prog"><button id="quit">✕ 終了</button><div class="track"><i style="width:${sess.done/sess.total*100}%"></i></div><span>${sess.done} / ${sess.total}</span></div>
    <section class="card" id="card" aria-live="polite">
      <span class="tagline">${isNew?"NEW":"REVIEW"} · No.${pad(id)}</span>
      ${n?`<span class="badge c-${n.color}"></span>`:""}
      <div class="w">${esc(w.w)}</div>
      ${sess.shown?`<div class="ans">
        <span class="pos">${w.pos}</span>
        <div class="m">${esc(w.m)}</div>
        <div class="ex"><span class="en">${hl(w.en,w.w)}</span><span class="ja">${esc(w.ja)}</span></div>
        ${n&&n.memo?`<div class="memo c-${n.color}">${esc(n.memo)}</div>`:""}
      </div>`:`<div class="tap">意味を思い浮かべてからタップ</div>`}
    </section>
    ${sess.shown?`<div class="grades">
      ${["もう一度","難しい","できた","簡単"].map((l,i)=>`<button class="g g${i+1}" data-g="${i+1}">${l}<small>${fmt(pv[i].ivl)}</small></button>`).join("")}
    </div><div class="kbd">キー 1〜4 でも採点できます</div>`
    :`<button class="btn pri reveal" id="show">答えを見る</button><div class="kbd">スペースキーでも答えを表示</div>`}
  </div>`;
  $("#quit").onclick=()=>{sess=null;renderDash();};
  if(!sess.shown){$("#card").onclick=reveal;$("#show").onclick=reveal;}
  else document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>grade(+b.dataset.g));
}
function reveal(){sess.shown=true;renderCard();}
function grade(g){
  const id=sess.q.shift(),now=Date.now(),pv=previews(S.cards[id],now)[g-1];
  S.cards[id]={s:pv.s,d:pv.d,due:pv.due,last:pv.last,reps:pv.reps,lapses:pv.lapses};save();
  sess.tally[g-1]++;
  if(g===1){sess.q.splice(Math.min(3,sess.q.length),0,id);} else sess.done++;
  sess.shown=false;renderCard();
}
function renderDone(){
  const t=sess.tally,min=Math.max(1,Math.round((Date.now()-sess.t0)/6e4)),acc=sess.total?Math.round((t[1]+t[2]+t[3])/(t[0]+t[1]+t[2]+t[3])*100):0;
  $("#view").innerHTML=`<section class="panel done">
    <h2>おつかれさま</h2>
    <p>${sess.total}語を約${min}分で復習しました。初回正答率 ${acc}%</p>
    <div class="stats" style="width:100%">
      <div class="stat"><b style="color:var(--again)">${t[0]}</b><span>もう一度</span></div>
      <div class="stat"><b style="color:var(--good)">${t[2]+t[1]}</b><span>できた・難しい</span></div>
      <div class="stat"><b style="color:var(--easy)">${t[3]}</b><span>簡単</span></div>
    </div>
    <button class="btn pri" id="back" style="width:100%">ダッシュボードへ</button>
  </section>`;
  $("#back").onclick=()=>{sess=null;renderDash();};
}

document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA")return;
  if(S.mode==="in"){if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);return;}
  if(!sess||!sess.q.length)return;
  if(!sess.shown&&(e.key===" "||e.key==="Enter")){e.preventDefault();reveal();}
  else if(sess.shown&&"1234".includes(e.key))grade(+e.key);
});

setMode(S.mode||"in");
</script>
